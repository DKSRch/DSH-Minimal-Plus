# The `minimal-plus` (极简模式+) agent preset: the liangshen two-phase anchor
# bootstrap with the minimal-gitbash subprocess shell backend.
#
# Phase 1 shows the exact Minimal wire shape (one-line persona, two tools:
# `bash` via gitbash-executor + `str_replace_editor`), anchoring the V4
# reasoning trajectory. After the anchor gate passes (first reasoning block
# contains `we` and no `let me`, or `maxBootstrapSteps` fallback), the wire
# switches to Code Mode (PTC) and the full tool catalog opens.
#
# Why this preset exists:
#  - the liangshen preset's PTY-based persistent shell cannot start on
#    Windows (`dsh-subprocess-local` refuses win32 terminal inspection)
#  - the minimal-gitbash preset works on Windows but has no two-phase
#    bootstrap and no promotion to the full tool catalog
#  - this preset combines both: gitbash-executor for Windows shell + the
#    liangshen tool-bootstrap.mjs for the two-phase anchor mechanism
#
# Unlike the liangshen preset, the shell is NOT persistent — each `bash`
# call spawns a fresh Git Bash process. This is the tradeoff for Windows
# compatibility (PTY is unavailable on win32).
#
# The filesystem uses the host's sandboxed `ctx.fs`, same as the liangshen
# preset (unlike minimal-gitbash which mounts a bare local filesystem).

# ── identity ────────────────────────────────────────────────────────────────

# Phase 1 shows only this one-line persona. `tool-bootstrap` filters the
# assembled sections down to the persona section during phase 1 and restores
# every section after promotion, appending the session's working directory.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: You are a helpful software engineer assistant.

# Two-phase input bootstrap with the exact Minimal phase-1 tools. Before the
# first durable tool/call event the model sees only `bash` plus
# `str_replace_editor`, only the `persona` prompt section, no runtime
# contexts, and only direct user messages. `anchorGate` holds the promotion
# open until the first reasoning block is minimal-like (four-step fallback);
# `promoteAfterFirstResponse` avoids a permanent two-tool session after a
# tool-less first response. After promotion the catalog is presented as
# Code Mode (PTC): a single `run_code` tool on the wire.
# `bootstrapMaxTokens` caps the phase-1 request output budget (community-
# observed "We need" trigger window, 1024) and is stripped after promotion.
- id: tool-bootstrap
  name: ./tool-bootstrap.mjs
  config:
    shellTools: [bash]
    commonTools: [str_replace_editor]
    messageSources: [user]
    anchorGate: true
    maxBootstrapSteps: 4
    promoteAfterFirstResponse: true
    bootstrapMaxTokens: 1024
    compactionTools: [read, write, edit, glob, grep, todo_write, ask_user_question]
    deferredSources: [agent-instructions, skill-catalog]
    deferredGraceSteps: 1
    promotedPresentation: code

# oh-we-need reasoning style guide (Phase 2 only). tool-bootstrap filters
# out every section whose name is not in PERSONA_SECTION_NAMES during
# Phase 1, so `reasoning:style` is invisible until promotion. Order -97
# places it after harness:source (-99) and before deployment:persona (0):
# the model learns what it is, then how to think, then what to do.
- id: reasoning-style
  name: ./reasoning-style.mjs

# Workspace instructions are quarantined by `tool-bootstrap` during phase 1
# and deferred one step after promotion, then stay current.
- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell (gitbash-executor, Windows compatible) ──────────────────────────

# The shell provider is an agent-owned service in an entry-local realm. The
# executor spawns Git Bash (`bash.exe -c <command>`) through the host
# subprocess service — a fresh shell per call, no PTY dependency. This is
# the key difference from the liangshen preset (which uses PTY-based
# persistent shell that cannot start on Windows).
#
# Sandbox: the MSYS runtime cannot initialize inside the Windows restricted-
# token sandbox, so the executor gates commands on the danger-full-access
# policy — switch the session to full access, or let the model retry a
# single command with sandbox_permissions: "danger-full-access" + justification.
- id: gitbash-shell
  name: cordis:group
  group: true
  disabled: !!js process.platform !== 'win32'
  isolate:
    shell: true
  config:
    - id: gitbash-executor
      name: ./gitbash-executor.mjs
      config:
        timeoutMs: 120000
        maxTimeoutMs: 600000
        maxOutputBytes: 64000
        maxSpillBytes: 67108864
        graceMs: 3000

    - id: tool-bash
      name: '@deepseek-ai/dsh-tool-bash'
      config:
        enableRunInBackground: false

# ── filesystem ──────────────────────────────────────────────────────────────

# Phase-1 editor uses the host's sandboxed `ctx.fs` (same as liangshen).
# No bare local filesystem is mounted, so the sandbox policy is respected.
- id: str-replace-editor
  name: '@deepseek-ai/dsh-tool-str-replace-editor'
  config:
    maxOutputChars: 16000

# ── standard filesystem tools ───────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# The `skill-catalog` pre-step message is quarantined by `tool-bootstrap`
# during phase 1 and deferred one step after promotion.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
